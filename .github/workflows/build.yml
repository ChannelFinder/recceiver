name: recceiver-build

on:
  push:
    branches: [ "master" ]
    paths:
      - src/**
      - pom.xml
      - .github/workflows/build.yml
      - .github/workflows/ci.yml
  pull_request:
    branches: [ "master" ]
    paths:
      - src/**
      - pom.xml
      - .github/workflows/build.yml
      - .github/workflows/ci.yml

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-22.04, macos-15, macos-14, windows-2022, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"
          cache: maven
      - name: Build with Maven
        run: mvn --batch-mode --update-snapshots package
      - name: Stage package
        run: mkdir -p staging && cp target/*.jar staging
      - uses: actions/upload-artifact@v4
        with:
          name: recceiver-package-${{ matrix.os }}
          path: staging

