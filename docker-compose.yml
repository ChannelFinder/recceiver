version: "3.9"

services:
  recceiver:
    build:
      context: .
      dockerfile: Dockerfile
    image: recceiver:local
    container_name: recceiver
    restart: unless-stopped
    network_mode: host
    environment:
      JAVA_OPTS: >-
        -DtcpBindAddress=0.0.0.0
        -DtcpPort=5064
        -DudpBroadcastAddress=127.0.0.1
        -DudpBroadcastPort=5049
        -Drecceiver.cf.enabled=true
        -Drecceiver.cf.service-url=http://localhost:8080/ChannelFinder
        -Drecceiver.cf.username=admin
        -Drecceiver.cf.password=adminPass



